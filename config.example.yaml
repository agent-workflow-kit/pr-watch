# Example config for pr-watch (docs/interface.md, Config).
# Location: ~/.config/pr-watch/config.yaml, drop-ins in config.d/*.yaml.
# Every value shown is the default; unset keys use the stated built-ins. Unknown keys are refused.
# Scalar keys may also be set as PR_WATCH_<KEY>, nested keys joined with __ (PR_WATCH_POLL__CONCURRENCY); not hooks lists, env_allow, cron, hosts or repos.

# me:
#   name: your-name           # only used for the default owner (human:<name>); identity is forgectl's

poll:
  interval_hint: 5m           # cron install default only (5m, 10m, 1h, ...)
  # full_every: 6             # cycles between full passes, per host; unset: 6 on GitHub, 12 on GitLab
  # concurrency: 4            # snapshot workers per host; unset: 4 on GitHub, 2 on GitLab
  host_low_water: 100         # forgectl rate_limit.remaining below this: snapshot only what must be
  overlap: 60s                # subtracted from the host-time watermark of a per-PR repo scope (covers search index lag)
  hosts_ttl: 1h               # how long whoami's host list is cached
  max_duration: 15m           # the cycle stops starting snapshots after this (at least 1ms)
  max_snapshots: 40           # snapshots started per host and cycle; deferred ones keep their triggers (0 is unlimited)

hosts: {}                     # per-host overrides: full_every and concurrency
  # example.com: {full_every: 12, concurrency: 2}

retention:
  events: 30d                 # how long events are kept: whole days, at least 30d

expiry:
  after_terminal: 7d          # a merged or closed PR's state is dropped this long after (up to a day later, in prune)

failures:
  unreachable_after: 5        # consecutive per-PR failures before a PR is unreachable (1 to 1000)

detect_force_push: false      # call forgectl compare to fill `forced`

ci:
  settle_polls: 1             # extra snapshots a CI change to or from none is held before its ci event (0 to 10)
  pending_max_age: 6h         # an unsettled PR is snapshotted every cycle for at most this long

forgectl:
  timeout: 120s               # forgectl --timeout per call
  max_output_mib: 32          # MiB read from one forgectl call (1 to 256)

hooks:
  max_per_poll: 50            # hook runs started per poll; 0: no hook runs (0 to 100000)
  max_per_pr_per_poll: 10     # 1 to 1000
  concurrency: 4              # hook workers, 1 to 32
  env_allow: []               # extra environment names hooks may see; hooks get a clean environment otherwise
  # Each hook name takes a list of {cmd, timeout (seconds, 1 to 600), async}; uncomment to use:
  # on-renamed: [{cmd: "my-script", timeout: 30, async: true}]
  # on-opened: [{cmd: "my-script", timeout: 30, async: true}]
  # on-reopened: [{cmd: "my-script", timeout: 30, async: true}]
  # on-pushed: [{cmd: "my-script", timeout: 30, async: true}]
  # on-retargeted: [{cmd: "my-script", timeout: 30, async: true}]
  # on-comment: [{cmd: "my-script", timeout: 30, async: true}]
  # on-review_comment: [{cmd: "my-script", timeout: 30, async: true}]
  # on-review: [{cmd: "my-script", timeout: 30, async: true}]
  # on-review_requested: [{cmd: "my-script", timeout: 30, async: true}]
  # on-approved: [{cmd: "my-script", timeout: 30, async: true}]
  # on-changes_requested: [{cmd: "my-script", timeout: 30, async: true}]
  # on-approval_withdrawn: [{cmd: "my-script", timeout: 30, async: true}]
  # on-ci: [{cmd: "my-script", timeout: 30, async: true}]
  # on-ready: [{cmd: "my-script", timeout: 30, async: true}]
  # on-converted_to_draft: [{cmd: "my-script", timeout: 30, async: true}]
  # on-merged: [{cmd: "my-script", timeout: 30, async: true}]
  # on-closed: [{cmd: "my-script", timeout: 30, async: true}]
  # post-poll: [{cmd: "my-script", timeout: 30, async: true}]

cron:
  env_file: null              # absolute path of a 0600 file the cron entry sources (for forgectl tokens); null: none

repos: {}                     # per-repo overrides: detect_force_push, ci.settle_polls, failures.unreachable_after
  # example.com/group/project: {detect_force_push: true, ci: {settle_polls: 2}, failures: {unreachable_after: 8}}
